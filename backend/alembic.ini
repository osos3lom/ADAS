# Alembic configuration for the ADAS-ECU backend.
#
# Schema is bootstrapped on startup via SQLModel create_all (see db/engine.py),
# which is enough to run. Alembic is the path for *evolving* the schema later:
#
#   alembic revision --autogenerate -m "describe change"
#   alembic upgrade head
#
# To adopt Alembic on a database already created by create_all, run once:
#   alembic stamp head
#
# The database URL is taken from the DATABASE_URL environment variable at
# runtime (see migrations/env.py); the value below is only a placeholder.

[alembic]
script_location = migrations
prepend_sys_path = .
sqlalchemy.url = postgresql+psycopg://adas:adas@localhost:5432/adas

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
